project_name: kubeflare
release:
  github:
    owner: hellofresh
    name: kubeflare
builds:
  - id: kubeflare
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    main: cmd/kubeflare/main.go
    ldflags: -s -w
      -X github.com/replicatedhq/kubeflare/pkg/version.version={{.Version}}
      -X github.com/replicatedhq/kubeflare/pkg/version.gitSHA={{.Commit}}
      -X github.com/replicatedhq/kubeflare/pkg/version.buildTime={{.Date}}
      -extldflags "-static"
    flags: -tags netgo -installsuffix netgo
    binary: kubeflare
    hooks: {}
dockers:
  - dockerfile: ./deploy/Dockerfile.manager
    image_templates:
      - "ghcr.io/hellofresh/kubeflare-manager:{{.Version}}"
    build_flag_templates:
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
