name: build
on:
  pull_request:
    branches:
      - 'master'

jobs:
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.19
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Build Docker image
        run: |
          make image
